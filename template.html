<!DOCTYPE html>
<html lang="ru" class="main">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Описание страницы в поиске -->
    <!-- TB.pade.template.description -->
    <meta name="description" content="Шаблон страницы сайта для PepeWiki">
    <!-- Автор данной страницы сайта -->
    <meta name="author" content="green_and_white">
    <!-- Разрешения для поисковых роботов -->
    <meta name="robots" content="index, follow">
    <meta name="color-scheme" content="light dark">
    
    <!-- Meta Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PepeWiki">
    <!-- Заголовок страницы сайта -->
    <!-- TB.pade.template.titlesite -->
    <meta property="og:title" content="PepeWiki — Шаблон страницы">
    <!-- Описание страницы сайта -->
    <!-- TB.pade.template.description -->
    <meta property="og:description" content="Шаблон страницы сайта для PepeWiki">
    <!-- Логотип сайта -->
    <meta property="og:image" content="https://greenandwhite.github.io/pepewiki/files/images/icon.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:url" content="https://greenandwhite.github.io/pepewiki/template.html">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/base.css">
    
    <!-- Заголовок страницы сайта -->
    <!-- TB.pade.template.titlesite -->
    <title>PepeWiki — Шаблон страницы</title>
  </head>

  <body>
    <main>
      <!-- Блок с названием страницы -->
      <section class="page-block-title">
        <!-- TB.pade.template.titlepage -->
        <h1>Шаблон страницы</h1>
        <hr>
      </section>
      
      <!-- Шаблон блока страницы -->
      <section class="page-block-base">
        <!-- TB.pade.template.padeblock.base.name -->
        <h2>Название блока страницы</h2>
        <!-- TB.pade.template.padeblock.base.note -->
        <p class="text-note">Примечание к блоку. Может быть пустым.</p>
        <!-- TB.pade.template.padeblock.base.content -->
        <p>Содержимое блока страницы в качестве текстового блока</p>
        <hr>
      </section>

      <!-- Блок с технической информацией -->
      <section class="page-block-data">
        <p class="text-note">
        <!-- TB.pade.template.padeblock.data.name -->
        <h2 class="text-note">Техническая информация</h2>
        <!-- TB.pade.template.padeblock.data.content -->
        <p class="text-note">...</p>
      </section>
    </main>
    
    <br>
    
    <!-- Футер сайта -->
    <footer class="pade-block-footer">
      <p>Не является частью сети серверов PepeLand</p>
      <p>Контакты  Правила  Дизайн</p>
      <p>Telegram  YouTube</p>
      <p>Документация</p>
    </footer>
  </body>
</html>
